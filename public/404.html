<!DOCTYPE html>
<!--
  없는 주소에 대한 응답. 이 파일이 없으면 Cloudflare Pages 가 홈 HTML 을
  200 으로 돌려준다 — 영어 방문자가 오타를 내면 한국어 홈이 뜨고, 검색
  엔진에는 '내용이 같은 페이지가 무수히 많은' 것으로 보인다.

  번들에 기대지 않고 혼자 선다. CSS 파일 이름에 해시가 붙어 빌드마다
  달라지므로, 여기서 그걸 참조하면 다음 빌드에 깨진다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IsFam — 페이지를 찾을 수 없습니다</title>
    <meta name="robots" content="noindex" />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fbf7f0;
        --ink: #151311;
        --muted: #696562;
        --btn: #f9801c;
        --btn-text: #2b1c0c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--cream);
        color: var(--ink);
        font-family: "Pretendard Variable", Pretendard, -apple-system,
          BlinkMacSystemFont, system-ui, sans-serif;
        text-wrap: pretty;
      }
      main { width: min(520px, 100%); text-align: center; }
      img { width: 96px; height: 96px; border-radius: 26px; }
      h1 {
        margin: 22px 0 0;
        font-size: clamp(26px, 5vw, 34px);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.3;
      }
      .en { display: block; margin-top: 6px; color: var(--muted); font-size: 0.62em; font-weight: 700; }
      p { margin: 14px 0 0; color: var(--muted); font-size: 16px; line-height: 1.75; }
      .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; }
      a {
        display: inline-flex;
        align-items: center;
        height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }
      .primary { background: var(--btn); color: var(--btn-text); }
      .ghost { border: 1px solid rgba(120, 112, 100, 0.28); color: var(--ink); }
      @media (prefers-reduced-motion: no-preference) {
        a { transition: background 0.2s ease, border-color 0.2s ease; }
      }
      .primary:hover { background: #ff8c1a; }
      .ghost:hover { border-color: rgba(120, 112, 100, 0.5); background: rgba(120, 112, 100, 0.07); }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/mascot-splash.webp" width="200" height="200" alt="" />
      <h1>
        페이지를 찾을 수 없습니다
        <span class="en">Page not found</span>
      </h1>
      <p>
        주소가 바뀌었거나 잘못 입력되었습니다.<br />
        The page you are looking for does not exist.
      </p>
      <div class="links">
        <a class="primary" href="/?lang=ko">한국어 홈으로</a>
        <a class="ghost" href="/en/">English home</a>
      </div>
    </main>
  </body>
</html>
